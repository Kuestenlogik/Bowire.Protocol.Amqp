name: Release

on:
  push:
    tags: ['v*']

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: write
  packages: write
  id-token: write  # Trusted Publishing: OIDC token exchanged for a one-hour nuget.org key

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # AssemblyVersion and FileVersion have to be numeric, so an
          # `-rc.N` tag contributes only the part before the dash. The
          # package keeps the full version; only the stamped assembly
          # drops the pre-release label.
          echo "ASSEMBLY_VERSION=${VERSION%%-*}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Bowire.Protocol.Amqp.slnx

      - name: Build & Test
        run: |
          dotnet build Bowire.Protocol.Amqp.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }} -p:FileVersion=${{ steps.version.outputs.ASSEMBLY_VERSION }}
          dotnet test --solution Bowire.Protocol.Amqp.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Bowire.Protocol.Amqp.slnx -c Release --no-build -o artifacts/packages -p:Version=${{ steps.version.outputs.VERSION }}

      # Every tag publishes to both feeds, RCs included. SemVer's
      # `-rc.N` suffix marks them as pre-release on NuGet, so
      # consumers only receive them on explicit opt-in (the
      # `--prerelease` flag for `dotnet add package`, or a pinned
      # `Version="1.0.0-rc.1"`). Stable-restore paths are untouched.
      # Matches the Bowire main repo's policy.
      - name: Publish to GitHub Packages
        if: ${{ github.ref_type == 'tag' }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/Kuestenlogik/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # nuget.org, through Trusted Publishing (no stored key): the policy on
      # nuget.org trusts this repository's release.yml.
      # The temporary key lives one hour, so it is fetched right before the push.
      - name: nuget.org login (OIDC → temporary API key)
        if: ${{ github.ref_type == 'tag' && vars.NUGET_USER != '' }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: ${{ github.ref_type == 'tag' && vars.NUGET_USER != '' }}
        # No separate .snupkg push — Directory.Build.props sets
        # DebugType=embedded so debug info ships inside the .nupkg
        # itself, and nuget.org's symbol-validation chain stays out
        # of the equation.
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: artifacts/packages/*.nupkg
